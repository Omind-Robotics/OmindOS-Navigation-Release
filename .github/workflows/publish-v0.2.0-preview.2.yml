name: Publish parameter API preview 2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.2.0-preview.2.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-v0.2.0-preview.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: v0.2.0-preview.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run parameter and customer profile tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify downloadable package and recorded acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/omindos-preview2
          cd /tmp/omindos-preview2
          base=https://omindos.cn/downloads/navigation/v0.2.0-preview.2
          curl --fail --location --retry 3 --max-time 240 "$base/omindos-navigation-0.2.0-preview.2-linux-amd64.tar" -o 'omindos-navigation-0.2.0-preview.2-linux-amd64.tar'
          curl --fail --location --retry 3 --max-time 60 "$base/parameter-api-source.tar.gz" -o parameter-api-source.tar.gz
          sha256sum --strict --check "$GITHUB_WORKSPACE/assets/v0.2.0-preview.2/SHA256SUMS-release.txt"
          tar -xf 'omindos-navigation-0.2.0-preview.2-linux-amd64.tar'
          cd omindos-navigation-0.2.0-preview.2
          ./omindos verify
          python3 - <<'PY'
          import json
          from pathlib import Path
          val=json.loads(Path('VALIDATION.json').read_text())
          assert val['status']=='PASS'
          assert val['parameter_configuration_tests']==13 and val['navigation_tests']==20
          assert all(p['status']=='PASS' and p['stopped_sec']>=1 for p in val['platforms'].values())
          check=json.loads(Path('INSTALLATION_CHECK.json').read_text())
          assert check['status']=='PASS' and all(v=='PASS' for v in check['api'].values())
          assert json.loads(Path('MANIFEST.json').read_text())['runtime_applied'] is False
          PY
      - name: Publish immutable version entry
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create "$VERSION" assets/v0.2.0-preview.2/* /tmp/omindos-preview2/parameter-api-source.tar.gz \
            --target "$GITHUB_SHA" --prerelease \
            --title 'OmindOS Navigation 0.2.0-preview.2 · 参数 API 与统一导航预览' \
            --notes-file RELEASE_NOTES.md
