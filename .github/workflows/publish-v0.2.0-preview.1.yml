name: Publish verified unified preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.2.0-preview.1.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-v0.2.0-preview.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: v0.2.0-preview.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate recorded runtime and test evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('assets')
          summary=json.loads((root/'RELEASE_SUMMARY.json').read_text())
          validation=json.loads((root/'VALIDATION.json').read_text())
          installation=json.loads((root/'INSTALLATION_CHECK.json').read_text())
          assert summary['sha256']=='cb5977638d80635bc0bc8002bfdfae9e431f723fdf9e151c8c8a9e51c84e1a3f'
          assert summary['publication_status']=='approved_preview'
          assert validation['test_result']=='PASS' and validation['test_count']==20
          assert all(v['status']=='PASS' and v['stopped_sec']>=1 for v in validation['platforms'].values())
          assert validation['image_id']==summary['image_id']
          assert installation['status']=='PASS'
          assert (root/'application-source.tar.gz').stat().st_size==25408
          PY
      - name: Publish pre-release with independent runtime download
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$VERSION" assets/* --target "$GITHUB_SHA" \
            --prerelease --title 'OmindOS Navigation 0.2.0-preview.1 · 轮式 / 四足统一导航预览' \
            --notes-file RELEASE_NOTES.md
